# Fills the course library with every Florida course from open data
# (Tools/CourseImport/florida.py). The free course API allows 1,000 calls a day,
# so this runs once a day and picks up where it stopped, until every course is in.
# Once they all are, a run only refreshes the hole drawings from OpenStreetMap (Mondays).
name: Course import

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Most course API calls this run
        default: '900'
      drawings:
        description: Fetch the OpenStreetMap drawings again (yes or no)
        default: 'no'

permissions:
  contents: write

concurrency:
  group: course-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Florida courses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the OpenGolfAPI open dataset
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengolfapi-us.ndjson.gz" https://raw.githubusercontent.com/opengolfapi/data/main/opengolfapi-us.ndjson.gz
          gunzip "$RUNNER_TEMP/opengolfapi-us.ndjson.gz"

      - name: Fetch scorecards
        run: python3 Tools/CourseImport/florida.py fetch-api --dataset "$RUNNER_TEMP/opengolfapi-us.ndjson" --limit "${{ inputs.limit || '900' }}"

      - name: Save the scorecards
        if: always()
        run: |
          Tools/CourseImport/save.sh "Course import: Florida scorecards" Tools/CourseImport/cache/api

      - name: Fetch hole drawings from OpenStreetMap
        # When asked, when there's no copy yet, and every Monday. A failure keeps the old copy.
        # Uses Geofabrik's daily Florida extract of OpenStreetMap, filtered down to golf by osmium.
        timeout-minutes: 30
        continue-on-error: true
        run: |
          if [ "${{ inputs.drawings }}" = "yes" ] || [ ! -f Tools/CourseImport/cache/osm-florida.json.gz ] || [ "$(date -u +%u)" = "1" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
            curl -fsSL -o "$RUNNER_TEMP/florida.osm.pbf" https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf
            osmium tags-filter "$RUNNER_TEMP/florida.osm.pbf" nwr/golf nwr/leisure=golf_course nwr/natural=water -o "$RUNNER_TEMP/golf.osm.pbf"
            osmium export "$RUNNER_TEMP/golf.osm.pbf" -f geojsonseq -a type,id --geometry-types=linestring,polygon -o "$RUNNER_TEMP/golf.geojsonseq"
            python3 Tools/CourseImport/florida.py fetch-osm "$RUNNER_TEMP/golf.geojsonseq"
          else
            echo "Using the OpenStreetMap copy from the last fetch"
          fi

      - name: Build the courses
        id: build
        run: |
          python3 Tools/CourseImport/florida.py build course-library
          python3 Tools/CourseLibrary/build_index.py course-library

      - name: Save
        # Always, so whatever was fetched is kept even if a later step failed.
        if: always()
        run: |
          # The courses only when they built cleanly.
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            Tools/CourseImport/save.sh "Course import: Florida courses from open data" Tools/CourseImport course-library
          else
            Tools/CourseImport/save.sh "Course import: OpenStreetMap copy" Tools/CourseImport/cache
          fi
