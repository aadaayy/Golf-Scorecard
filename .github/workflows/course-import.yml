# Fills the course library with every Florida course from open data
# (Tools/CourseImport/florida.py). The free course API answers about 500 calls a day,
# so this runs once a day and picks up where it stopped, until every course is in.
# The courses are rebuilt when new scorecards came in, when asked, and every
# Monday, so hole drawings follow what's been added to OpenStreetMap.
name: Course import

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Most course API calls this run
        default: '490'
      rebuild:
        description: Rebuild the courses even with no new scorecards (yes or no)
        default: 'no'

permissions:
  contents: write

concurrency:
  group: course-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Florida courses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the OpenGolfAPI open dataset
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengolfapi-us.ndjson.gz" https://raw.githubusercontent.com/opengolfapi/data/main/opengolfapi-us.ndjson.gz
          gunzip "$RUNNER_TEMP/opengolfapi-us.ndjson.gz"

      - name: Fetch scorecards
        id: fetch
        run: |
          before=$(ls Tools/CourseImport/cache/api 2>/dev/null | wc -l)
          python3 Tools/CourseImport/florida.py fetch-api --dataset "$RUNNER_TEMP/opengolfapi-us.ndjson" --limit "${{ inputs.limit || '490' }}"
          after=$(ls Tools/CourseImport/cache/api | wc -l)
          echo "new=$((after - before))" >> "$GITHUB_OUTPUT"

      - name: Save the scorecards
        if: always()
        run: |
          Tools/CourseImport/save.sh "Course import: Florida scorecards" Tools/CourseImport/cache

      - name: Decide whether to rebuild
        id: decide
        run: |
          if [ "${{ steps.fetch.outputs.new }}" != "0" ] || [ "${{ inputs.rebuild }}" = "yes" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "rebuild=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to build"
          fi

      - name: Get the hole drawings from OpenStreetMap
        # Geofabrik's daily Florida extract of OpenStreetMap, filtered down to golf by osmium.
        if: steps.decide.outputs.rebuild == 'yes'
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/florida.osm.pbf" https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf
          osmium tags-filter "$RUNNER_TEMP/florida.osm.pbf" nwr/golf nwr/leisure=golf_course nwr/natural=water -o "$RUNNER_TEMP/golf.osm.pbf"
          osmium export "$RUNNER_TEMP/golf.osm.pbf" -f geojsonseq -a type,id --geometry-types=linestring,polygon -o "$RUNNER_TEMP/golf.geojsonseq"
          python3 Tools/CourseImport/florida.py fetch-osm "$RUNNER_TEMP/golf.geojsonseq" "$RUNNER_TEMP/osm.json.gz"

      - name: Build the courses
        if: steps.decide.outputs.rebuild == 'yes'
        run: |
          python3 Tools/CourseImport/florida.py build course-library --osm "$RUNNER_TEMP/osm.json.gz"
          python3 Tools/CourseLibrary/build_index.py course-library
          python3 Tools/CourseLibrary/build_index.py course-library --check

      - name: Save the courses
        if: steps.decide.outputs.rebuild == 'yes'
        run: |
          Tools/CourseImport/save.sh "Course import: Florida courses from open data" Tools/CourseImport course-library
