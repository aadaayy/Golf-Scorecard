# Automatic checks on every push.
#  1. Logic tests: course files and scoring math, on Linux (cheap and fast).
#  2. App build and walk-through: builds the iPhone app and plays through it on
#     iPhone Pro Max, iPhone Pro and iPhone Duo simulators, one Mac per phone so
#     the slower free Macs aren't running three simulators at once.
#  3. Publish: gathers every phone's screenshots onto the screenshots branch.
# Checks run only on pushes to main that change more than notes (.md files), the
# Mac jobs only run after the logic tests pass, and a newer push cancels an older run.
name: Checks

on:
  push:
    branches: [main]
    # Course library changes get their own quick check (course-library.yml).
    paths-ignore: ['**.md', 'course-library/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: swift test

  app:
    name: App on ${{ matrix.phone }}
    needs: logic
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        phone: [Pro Max, Pro, Duo]
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available | grep -i "iphone" || true

      - name: Pick simulator
        id: pick
        env:
          PHONE: ${{ matrix.phone }}
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          # ArrangementView needs the iOS 27.1 SDK; older Xcode builds the plain side-by-side layout instead.
          flags=$(python3 -c "v=tuple(int(x) for x in '$sdk'.split('.')[:2]); print('' if v >= (27, 1) else 'NO_DUO_SDK')")
          devices=$(xcrun simctl list devices available)
          case "$PHONE" in
            "Pro Max")
              device=$(echo "$devices" | grep -oE "iPhone [0-9]+ Pro Max" | sort -u | tail -1)
              if [ -z "$device" ]; then device=$(echo "$devices" | grep -oE "iPhone [0-9]+( Pro)?" | sort -u | tail -1); fi ;;
            # A regular-size phone (iPhone N Pro, not Max) for the narrow sideways layout
            "Pro") device=$(echo "$devices" | grep -oE "iPhone [0-9]+ Pro \(" | sed 's/ ($//' | sort -u | tail -1) ;;
            "Duo") device=$(echo "$devices" | grep -oE "iPhone Duo[^(]*" | sed 's/ *$//' | sort -u | head -1) ;;
          esac
          echo "::notice title=Tools::$(xcodebuild -version | tr '\n' ' ')| iOS SDK $sdk | simulator: ${device:-no $PHONE simulator}"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Start the simulator
        # Booting while the tests start can time out the test runner, so boot first.
        if: steps.pick.outputs.device != ''
        env:
          DEVICE: ${{ steps.pick.outputs.device }}
        run: |
          python3 - <<'PYBOOT'
          import json, os, subprocess
          name = os.environ["DEVICE"]
          listing = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          udid = None
          for runtime, devices in sorted(listing["devices"].items()):
              for d in devices:
                  if d["name"] == name:
                      udid = d["udid"]  # newest runtime wins
          subprocess.run(["xcrun", "simctl", "boot", udid])
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True, timeout=900)
          print(f"{name} booted")
          PYBOOT

      - name: Make a copy of the course library
        # Find Courses downloads from this copy, so the checks don't need the internet.
        run: python3 Tools/CourseLibrary/make_library.py "$RUNNER_TEMP/course-library"

      - name: Build and walk through the app
        if: steps.pick.outputs.device != ''
        env:
          # Passed to the walk-through as COURSE_LIBRARY_URL
          TEST_RUNNER_COURSE_LIBRARY_URL: file://${{ runner.temp }}/course-library/
        run: |
          set -o pipefail
          xcodebuild test \
            -project GolfScorecard.xcodeproj \
            -scheme GolfScorecard \
            -destination "platform=iOS Simulator,name=${{ steps.pick.outputs.device }}" \
            -resultBundlePath build/Checks.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) ${{ steps.pick.outputs.flags }}"

      - name: Report build errors and test failures
        if: failure()
        run: |
          # Run logs can't always be opened, so surface the first errors as annotations.
          [ -d build/Checks.xcresult ] || exit 0
          xcrun xcresulttool get build-results --path build/Checks.xcresult > build/build-results.json || true
          xcrun xcresulttool get test-results summary --path build/Checks.xcresult > build/test-summary.json || true
          python3 - <<'PY'
          import json
          def load(p):
              try: return json.load(open(p))
              except Exception: return {}
          b = load("build/build-results.json")
          for e in (b.get("errors") or [])[:15]:
              where = e.get("sourceURL", "").split("#")[0].split("/")[-1]
              print(f"::error title=Build error {where}::{e.get('message', '')}".replace("\n", " "))
          # Which test failed on which simulator
          import subprocess
          try:
              tree = json.loads(subprocess.check_output(["xcrun", "xcresulttool", "get", "test-results", "tests", "--path", "build/Checks.xcresult"]))
          except Exception:
              tree = {}
          def walk(node, path):
              name = node.get("name", "")
              if node.get("result") == "Failed" and node.get("nodeType") in ("Device", "Test Case Run", "Repetition"):
                  print(f"::error title=Failed on::{' / '.join(path[-2:] + [name])}")
              for child in node.get("children", []) or []:
                  walk(child, path + [name])
          for node in tree.get("testNodes", []):
              walk(node, [])
          t = load("build/test-summary.json")
          for f in (t.get("testFailures") or [])[:15]:
              print(f"::error title=Test failed {f.get('testName', '')}::{f.get('targetName', '')} {f.get('failureText', '')}".replace("\n", " "))
          PY

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d build/Checks.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Checks.xcresult --output-path screenshots || true
          fi
          ls -la screenshots

      - name: Name and turn the screenshots
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p publish
          [ -f screenshots/manifest.json ] || exit 0
          # Name each picture after its simulator and step, e.g. "iPhone Duo - 2-open-card-and-map.png"
          python3 - <<'PYNAME'
          import json, shutil
          for test in json.load(open("screenshots/manifest.json")):
              for a in test.get("attachments", []):
                  try:
                      step = a["suggestedHumanReadableName"].split("_0_")[0]
                      # Artifact names can't hold quotes, colons and the like (a failed test's own attachments do)
                      step = "".join(c for c in step if c not in '"<>|*?:\\/\r\n')
                      shutil.copy(f"screenshots/{a['exportedFileName']}", f"publish/{a.get('deviceName', 'iPhone')} - {step}.png")
                  except Exception as error:
                      print(f"::warning title=Screenshot skipped::{error}")
          PYNAME
          # Simulator screenshots are always upright; turn the sideways ones
          for f in publish/*sideways-card-and-map.png publish/*open-duo-size*.png publish/*sideways-hole-view*.png publish/*sideways-home.png publish/*sideways-past-rounds.png publish/*sideways-profile.png publish/*sideways-find-courses.png publish/*sideways-hole-10.png publish/*sideways-profile-*.png; do sips -r 270 "$f" >/dev/null || echo "::warning title=Not turned::$f"; done
          files=(publish/*.png)
          echo "::notice title=Screenshots::${#files[@]} exported on ${{ matrix.phone }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ strategy.job-index }}
          path: publish
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish screenshots
    needs: app
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to publish screenshots to the screenshots branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: publish
          merge-multiple: true

      - name: Publish screenshots to the screenshots branch
        run: |
          shopt -s nullglob
          files=(publish/*.png)
          echo "::notice title=Screenshots::${#files[@]} published"
          [ ${#files[@]} -eq 0 ] && exit 0
          cd publish
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
