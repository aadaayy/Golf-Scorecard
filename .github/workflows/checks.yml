# Automatic checks on every push.
#  1. Logic tests: course files and scoring math, on Linux (cheap and fast).
#  2. App build and walk-through: builds the iPhone app on a Mac, plays one hole
#     in the simulator and saves screenshots (download them from the run's
#     Summary page, under Artifacts).
# Mac minutes cost more than Linux ones, so the Mac job only runs after the
# logic tests pass, stops after 30 minutes, and cancels older runs of the same branch.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: swift test

  app:
    name: App build and walk-through
    needs: logic
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write  # only to publish screenshots to the screenshots branch
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available | grep -i "iphone" || true

      - name: Pick simulator
        id: pick
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          # ArrangementView needs the iOS 27.1 SDK; older Xcode builds the plain side-by-side layout instead.
          flags=$(python3 -c "v=tuple(int(x) for x in '$sdk'.split('.')[:2]); print('' if v >= (27, 1) else 'NO_DUO_SDK')")
          devices=$(xcrun simctl list devices available)
          device=$(echo "$devices" | grep -oE "iPhone [0-9]+ Pro Max" | sort -u | tail -1)
          if [ -z "$device" ]; then device=$(echo "$devices" | grep -oE "iPhone [0-9]+( Pro)?" | sort -u | tail -1); fi
          duo=$(echo "$devices" | grep -oE "iPhone Duo[^(]*" | sed 's/ *$//' | sort -u | head -1)
          echo "SDK $sdk, extra flags '$flags', simulator '$device'"
          echo "::notice title=Tools::$(xcodebuild -version | tr '\n' ' ')| iOS SDK $sdk | simulator: $device | Duo simulator: ${duo:-none}"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Build and walk through the app
        run: |
          set -o pipefail
          xcodebuild test \
            -project GolfScorecard.xcodeproj \
            -scheme GolfScorecard \
            -destination "platform=iOS Simulator,name=${{ steps.pick.outputs.device }}" \
            -resultBundlePath build/Checks.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) ${{ steps.pick.outputs.flags }}"

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d build/Checks.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Checks.xcresult --output-path screenshots || true
          fi
          ls -la screenshots

      - name: Publish screenshots to the screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          shopt -s nullglob
          files=(screenshots/*.png screenshots/*.jpg screenshots/*.jpeg screenshots/*.heic)
          echo "::notice title=Screenshots::${#files[@]} exported"
          [ ${#files[@]} -eq 0 ] && exit 0
          mkdir publish
          cp screenshots/* publish/
          cd publish
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: warn
